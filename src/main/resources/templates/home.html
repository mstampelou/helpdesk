<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Home')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{layout/base :: sidebar('home')}"></aside>

    <main class="main">
        <div class="home-screen">
            <div class="home-logo"><i class="bi bi-ticket-perforated"></i></div>
            <h1>HelpDesk</h1>
            <p class="tagline">Internal IT support ticketing — track, assign, and resolve issues fast.</p>

            <a th:href="@{/tickets}" class="home-enter">Go to tickets →</a>

            <div class="home-stats">
                <div class="cell">
                    <p class="value" th:text="${openCount}">0</p>
                    <p class="label">Open tickets</p>
                </div>
                <div class="cell">
                    <p class="value" th:text="${inProgressCount}">0</p>
                    <p class="label">In progress</p>
                </div>
                <div class="cell">
                    <p class="value" th:text="${resolvedTodayCount}">0</p>
                    <p class="label">Resolved today</p>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
