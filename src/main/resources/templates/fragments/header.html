<header th:fragment="headerFragment"
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/springsecurity">
    <div class="outer">
        <div class="items">
            <a th:href="@{/}">
                <i class="bi bi-ticket-perforated header-logo"></i>
            </a>
            <span class="title">HelpDesk — Internal IT Support</span>
        </div>
        <div class="login-name">
            <span sec:authorize="isAuthenticated()" th:text="${#authentication.name}"></span>

            <form sec:authorize="isAuthenticated()"
                  th:action="@{/logout}"
                  method="post"
                  style="display: inline">
                <button type="submit" class="log-out" style="background: none; border: none; padding: 0; cursor: pointer">
                    Sign out
                </button>
            </form>
        </div>
    </div>
    <div class="line"></div>
</header>
