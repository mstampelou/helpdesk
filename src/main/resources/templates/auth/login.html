<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Sign in')}"></head>
<body>
<div class="login-screen">
    <div class="login-box">
        <div class="login-logo">
            <div class="mark"><i class="bi bi-ticket-perforated"></i></div>
            <h1>HelpDesk Portal</h1>
            <p>Internal IT Support</p>
        </div>

        <div class="login-card">
            <div class="login-error" th:if="${param.error}">
                <span>Invalid username or password.</span>
            </div>
            <div class="login-error" th:if="${param.logout}" style="color: #34d399; background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.2);">
                <span>You have been signed out.</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="field">
                    <label for="username">Username</label>
                    <input class="input" style="width:100%" type="text" id="username" name="username" placeholder="your.username" autocomplete="username" required/>
                </div>
                <div class="field" style="margin-bottom: 20px;">
                    <label for="password">Password</label>
                    <input class="input" style="width:100%" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
                </div>
                <button type="submit" class="login-submit">Sign in</button>
            </form>
        </div>

        <p class="login-footer">Demo accounts: admin.demo / james.support / maria.support / user.demo — password: password123</p>
    </div>
</div>
</body>
</html>
