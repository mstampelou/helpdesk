<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ticket Created</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/helpdesk-theme.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/ticketsuccess.css}">
</head>
<body>
<header th:replace="~{fragments/header :: headerFragment}"></header>

<main class="main-content">
    <div class="success-frame" role="alert">
        <p class="success-title">Ticket created successfully</p>
        <p class="success-label" th:text="${ticketReadOnlyDTO.title}"></p>
        <p class="success-uuid" th:text="${ticketReadOnlyDTO.uuid}"></p>
        <span class="badge" th:classappend="'badge-status-' + ${ticketReadOnlyDTO.status.name().toLowerCase()}"
              th:text="${ticketReadOnlyDTO.status}"></span>
        <span class="badge" th:classappend="'badge-priority-' + ${ticketReadOnlyDTO.priority.name().toLowerCase()}"
              th:text="${ticketReadOnlyDTO.priority}"></span>
    </div>

    <div class="actions">
        <a class="btn" th:href="@{/tickets/{uuid}(uuid=${ticketReadOnlyDTO.uuid})}">View ticket</a>
        <a class="btn" th:href="@{/tickets/insert}">Create another</a>
        <a class="btn" th:href="@{/tickets}">Back to list</a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footerFragment}"></footer>
</body>
</html>
