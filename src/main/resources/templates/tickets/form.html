<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head(${editing} ? 'Edit Ticket' : 'New Ticket')}"></head>
<body>
<div class="app-shell">
    <aside th:replace="~{layout/base :: sidebar('tickets')}"></aside>

    <main class="main">
        <div class="topbar">
            <div class="titles">
                <p class="title" th:text="${editing} ? ('Edit TKT-' + ${ticketForm.id}) : 'New Ticket'">Title</p>
                <p class="sub" th:if="${editing}" th:text="${ticketForm.title}"></p>
                <p class="sub" th:unless="${editing}">Open a new support request</p>
            </div>
            <div class="actions">
                <a th:href="@{/tickets}" class="btn btn-subtle">✕ Cancel</a>
            </div>
        </div>

        <div class="content">
            <form th:action="${editing} ? @{/tickets/{id}(id=${ticketForm.id})} : @{/tickets}"
                  th:object="${ticketForm}" method="post" style="max-width:560px;margin:0 auto;">

                <div class="field">
                    <label for="title">Title *</label>
                    <input class="input" type="text" id="title" th:field="*{title}" placeholder="One-line summary of the issue"/>
                    <p class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">error</p>
                </div>

                <div class="field">
                    <label for="description">Description *</label>
                    <textarea class="textarea" id="description" th:field="*{description}" rows="8"
                              placeholder="Steps to reproduce, affected users, machine names, error messages…"></textarea>
                    <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">error</p>
                </div>

                <div class="field-row mb-16">
                    <div class="field" style="margin-bottom:0;">
                        <label for="categoryId">Category</label>
                        <select class="select" id="categoryId" th:field="*{categoryId}">
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Category</option>
                        </select>
                    </div>
                    <div class="field" style="margin-bottom:0;">
                        <label for="priority">Priority</label>
                        <select class="select" id="priority" th:field="*{priority}">
                            <option value="CRITICAL">Critical</option>
                            <option value="HIGH">High</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="LOW">Low</option>
                        </select>
                    </div>
                </div>

                <div class="field-row mb-16">
                    <div class="field" style="margin-bottom:0;" th:if="${editing}">
                        <label for="status">Status</label>
                        <select class="select" id="status" th:field="*{status}">
                            <option value="OPEN">Open</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="RESOLVED">Resolved</option>
                            <option value="CLOSED">Closed</option>
                        </select>
                    </div>
                    <div class="field" style="margin-bottom:0;">
                        <label for="assignedToId">Assign to</label>
                        <select class="select" id="assignedToId" th:field="*{assignedToId}">
                            <option value="">Unassigned</option>
                            <option th:each="u : ${agents}" th:value="${u.id}" th:text="${u.fullName}">Agent</option>
                        </select>
                    </div>
                </div>

                <div class="field">
                    <label for="tagsInput">Tags (comma separated)</label>
                    <input class="input" type="text" id="tagsInput" th:field="*{tagsInput}" placeholder="vpn, windows-update, finance"/>
                </div>

                <div style="padding-top:12px;border-top:1px solid var(--border-soft);display:flex;gap:12px;">
                    <button type="submit" class="btn btn-primary" th:text="${editing} ? 'Save Changes' : 'Create Ticket'">Save</button>
                    <a th:href="@{/tickets}" class="btn btn-ghost">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
