<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/helpdesk-theme.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/ticketinsert.css}">
</head>
<body>
<header th:replace="~{fragments/header :: headerFragment}"></header>

<main class="main-content">
    <div class="outer-content">
        <form method="post" th:action="@{/tickets/{uuid}/edit(uuid=${uuid})}" th:object="${ticketUpdateDTO}"
              xmlns:sec="http://www.thymeleaf.org/extras/springsecurity">

            <div class="row">
                <div class="col-lg-12 min-height-100">
                    <label th:for="title">Title:</label><br>
                    <input type="text" th:field="*{title}"/>
                    <div th:if="${#fields.hasErrors('title')}">
                        <p class="error" th:errors="*{title}"></p>
                    </div>
                </div>

                <div class="col-lg-12 min-height-100">
                    <label th:for="description">Description:</label><br>
                    <textarea rows="5" th:field="*{description}"></textarea>
                    <div th:if="${#fields.hasErrors('description')}">
                        <p class="error" th:errors="*{description}"></p>
                    </div>
                </div>

                <div class="col-lg-6 min-height-100">
                    <label for="priority">Priority:</label><br>
                    <select id="priority" th:field="*{priority}">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                </div>

                <div class="col-lg-6 min-height-100">
                    <label for="categoryId">Category:</label><br>
                    <select id="categoryId" th:field="*{categoryId}">
                        <option th:each="category : ${categoriesReadOnlyDTO}"
                                th:value="${category.id}"
                                th:text="${category.name}"></option>
                    </select>
                </div>

                <!-- Status/assignment: only ADMIN/SUPPORT can change these —
                     the service silently ignores them for a plain USER, so
                     we hide them here to match, rather than show controls
                     that quietly do nothing. -->
                <div class="col-lg-6 min-height-100" sec:authorize="hasAnyRole('ADMIN','SUPPORT')">
                    <label for="status">Status:</label><br>
                    <select id="status" th:field="*{status}">
                        <option value="OPEN">Open</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="RESOLVED">Resolved</option>
                        <option value="CLOSED">Closed</option>
                    </select>
                </div>

                <div class="col-lg-6 min-height-100" sec:authorize="hasAnyRole('ADMIN','SUPPORT')">
                    <label for="assignedToId">Assign to:</label><br>
                    <select id="assignedToId" th:field="*{assignedToId}">
                        <option value="">Unassigned</option>
                        <option th:each="agent : ${agentsReadOnlyDTO}"
                                th:value="${agent.uuid}"
                                th:text="${agent.fullName}"></option>
                    </select>
                </div>

                <div class="col-lg-12 min-height-100">
                    <label>Tags:</label><br>
                    <div class="tags-row">
                        <label class="tag-chip" th:each="tag : ${tagsReadOnlyDTO}">
                            <input type="checkbox" th:field="*{tagIds}" th:value="${tag.id}"/> <span th:text="${tag.name}">tag</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="row">
                <button type="submit" class="custom-button-green">Save Changes</button>
                <a th:href="@{/tickets/{uuid}(uuid=${uuid})}" class="btn btn-subtle" style="margin-left:8px;">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footerFragment}"></footer>
</body>
</html>
