# ============================================================
# DEMO CONFIG ? H2 in-memory, MySQL-compatibility mode.
# Zero setup: just ./gradlew bootRun. Data resets every restart
# (fresh from Flyway seed data every time — good for demos).
# ============================================================
#spring.datasource.url=jdbc:h2:mem:helpdesk;MODE=MySQL;DATABASE_TO_LOWER=TRUE
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

# ============================================================
# REAL RUN ? swap in once your Docker MySQL (port 3307) is up.
# Comment out the H2 block above, uncomment this, delete
# UUID()-free seed if you re-enable the MySQL-only UUID() calls.
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3307/helpdesk_dev
spring.datasource.username=${DB_USERNAME:helpdesk_app}
spring.datasource.password=${DB_PASSWORD:helpdesk_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
